runs:
  - id: gnk-n500-oracle-gate
    status: completed
    branch: exp-oracle-gate-n500
    command: "python scripts/compute_gnk_n500_oracle_gate.py --n-obs 500 --seeds 0,100 --cache-dir res/gnk --output-dir notebooks/plots --output-prefix gnk_n500_oracle_gate_20260425"
    inputs:
      cache: "res/gnk/nuts_cache_v2_n_obs_500_seed_{0..100}.pkl"
      seeds: 101
      posterior_samples_per_seed: 10000
    outputs:
      - notebooks/plots/gnk_n500_oracle_gate_20260425_per_seed.csv
      - notebooks/plots/gnk_n500_oracle_gate_20260425_summary.json
    decision_needed: null
    notes: "Theta-space Gaussian oracle KL K_theta^*(n=500) median=0.099533 nats, IQR=[0.077337, 0.135198] over 101 cached NUTS posterior seeds. By the <=0.1 nats rule, n=500 is acceptable for the high-budget curve, but it is close to the threshold."

  - id: gnk-coordinate-u-kl-decomp
    status: completed
    branch: exp-u-space-kl-decomp
    reviewed_implementation_commit: 1da4752
    command: "python scripts/compute_gnk_u_space_kl_decomp.py --output-prefix gnk_u_space_kl_decomp_20260425 && python scripts/plot_gnk_u_space_kl_decomp.py --input-csv notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv --output-prefix gnk_u_space_kl_decomp_20260425_N_gt_n --exclude-N-equals-n --min-seeds 101"
    inputs:
      cache:
        nuts: "res/gnk/nuts_cache_v2_n_obs_{n}_seed_{seed}.pkl and res/gnk/nuts_cache_v2_flow_n_obs_{n}_seed_{seed}.pkl"
        gaussian_npe_samples: "res/gnk/gaussian_npe_n_obs_{n}_n_sims_{N}_seed_{seed}/posterior_samples.pkl"
      rows: 1617
      n_values:
        - 100
        - 500
        - 1000
        - 5000
      note: "Raw CSV includes N=n low-budget diagnostic rows and the legacy one-seed N=31623 row. Main Delta component figure excludes N=n and requires at least 101 seeds per (n,N) group."
      jitter_retry: "Pérez-Cruz oracle KL estimates retry with deterministic Gaussian jitter at scale eps * max(pooled_sd, 1.0) only when duplicate/zero nearest-neighbour distances produce non-finite values; applied to 26 unique n=100 seeds for both theta-space and u-space oracle KL, corresponding to 104 repeated rows in the per-config table."
    outputs:
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_summary.json
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_delta_u_mean_cov.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_coord_offset_vs_n.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_plot_metadata.json
      - notebooks/plots/gnk_eta_vs_u_oracle_check_20260425.csv
      - notebooks/plots/gnk_eta_vs_u_oracle_check_20260425.json
    decision_needed: null
    notes: "K_theta^* remains the theta-space BvM-premise diagnostic. coord_offset=K_u^*-K_theta^* is the coordinate-projection offset. Delta_N,u is native u-space Gaussian-NPE approximation error reconstructed from saved Gaussian-NPE posterior samples, not a pure BvM residual. Scientific-code review found no mathematical blocker after excluding the one-seed diagnostic row from the main plot and qualifying finite-sample kNN affine-invariance wording."

  - id: gnk-log-corrected-scaling
    status: completed
    branch: exp-log-corrected-scaling
    command: "python scripts/plot_gnk_u_space_kl_decomp.py --input-csv notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv --output-prefix gnk_u_space_kl_decomp_20260425_N_gt_n --exclude-N-equals-n --min-seeds 101"
    inputs:
      aggregate_table: "notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv"
      note: "Plot-only task derived from the existing reviewed decomposition CSV; no fresh compute or retraining was run. Main theorem-facing scaled-budget panel excludes N=n and requires at least 101 seeds per (n,N) group. Uses native u-space Gaussian-NPE Delta_u_total from the reviewed decomposition table."
    outputs:
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_delta_u_mean_cov.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_coord_offset_vs_n.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_delta_u_total_scaled_budget_log_corrected.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_plot_metadata.json
    decision_needed: null
    notes: "Preserves x = N/(d^2 n) and adds x_log = N/(d^2 n log(N)^2) in a companion two-panel scaled-budget figure with shared y-axis. Natural logs are used. The dotted reference overlay is proportional to log(N)/sqrt(N/(d^2 n)); equivalently proportional to 1/sqrt(x_log) in the log-corrected panel. The log-corrected panel is a finite-N visualisation of the existing BvM logarithmic factor, not a new rate."

  - id: gnk-hpc-calibration
    status: prepared
    branch: exp-hpc-calibration
    command: "python npe_convergence/scripts/run_gnk_gaussian_hpc_calibration.py --dry-run --config res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/config.yaml"
    selected_n: 500
    n_candidate:
      - 500
      - 1000
    x_grid_candidate:
      - 25
      - 50
      - 100
      - 200
      - 500
    calibration_candidates:
      - n: 500
        x: 25
        N: 1512500
        seed: 88
        selected: false
        output_dir: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x25_seed88_20260425T065035Z"
        config_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x25_seed88_20260425T065035Z/config.yaml"
        validation_curve_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x25_seed88_20260425T065035Z/validation_curve.csv"
        predicted_u_mean_cov_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x25_seed88_20260425T065035Z/gaussian_npe_u_posterior.npz"
        sample_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x25_seed88_20260425T065035Z/posterior_samples_10k.npz"
        timing_metadata_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x25_seed88_20260425T065035Z/timing_metadata.json"
        stdout_log_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x25_seed88_20260425T065035Z/logs/stdout.log"
        stderr_log_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x25_seed88_20260425T065035Z/logs/stderr.log"
        selected_output_collisions_at_prepare_time: false
      - n: 500
        x: 50
        N: 3025000
        seed: 88
        selected: true
        output_dir: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z"
        config_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/config.yaml"
        validation_curve_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/validation_curve.csv"
        predicted_u_mean_cov_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/gaussian_npe_u_posterior.npz"
        sample_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/posterior_samples_10k.npz"
        timing_metadata_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/timing_metadata.json"
        stdout_log_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/logs/stdout.log"
        stderr_log_path: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/logs/stderr.log"
        selected_output_collisions_at_prepare_time: false
    selected_calibration_x: 50
    resolved_N: 3025000
    seed: 88
    seed_selection:
      rule: "Choose the seed whose cached Delta_u_total is closest to the median among finite complete-seed rows with n=500 and N=250000 in notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv."
      source_rows: 101
      median_Delta_u_total: 2.634332000648568
      selected_seed_Delta_u_total: 2.634332000648568
      fallback_used: false
    dry_run_command: "python npe_convergence/scripts/run_gnk_gaussian_hpc_calibration.py --dry-run --config res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/config.yaml"
    prepare_command: "python npe_convergence/scripts/run_gnk_gaussian_hpc_calibration.py --dry-run --write-config --selected-x 50 --created-at 2026-04-25T06:50:35Z --run-id gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z"
    submit_command: "qsub npe_convergence/scripts/pbs_jobs/gnk_gaussian_hpc_calibration_n500_x50_seed88.sh"
    scheduler_job_id: null
    output_dir: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z"
    expected_outputs:
      config: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/config.yaml"
      validation_curve: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/validation_curve.csv"
      validation_curve_plot: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/validation_curve.pdf"
      predicted_u_mean_cov: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/gaussian_npe_u_posterior.npz"
      samples_10k: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/posterior_samples_10k.npz"
      timing_metadata: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/timing_metadata.json"
      stdout_log: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/logs/stdout.log"
      stderr_log: "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/logs/stderr.log"
    scheduler_resource_request:
      scheduler: PBS
      job_type: single_non_array
      walltime: "47:00:00"
      mem: 64GB
      ncpus: 4
      ngpus: 0
    outputs:
      - "res/gnk_hpc_calibration/gnk_gaussian_npe_n500_x50_seed88_20260425T065035Z/config.yaml"
      - "npe_convergence/scripts/run_gnk_gaussian_hpc_calibration.py"
      - "npe_convergence/scripts/pbs_jobs/gnk_gaussian_hpc_calibration_n500_x50_seed88.sh"
    decision_needed: "After calibration, decide whether the full high-budget array is feasible and which x grid to submit."
    notes: "Prepared exactly one non-array n=500 Gaussian-NPE calibration job. Dry-run table covers x=25 and x=50. Selected x=50 because it is the preferred calibration point and N=3,025,000 is plausible under existing 47-48h/64GB PBS patterns while remaining a single calibration run. This local machine is not an HPC submit environment, so no job was submitted and no full array was submitted. Full high-budget array remains blocked pending review of this calibration result and dry-run table."

  - id: gnk-model-control-pilot
    status: blocked
    blocked_by:
      - gnk-hpc-calibration
    branch: exp-gnk-model-control
    command: null
    inputs:
      simulator: gnk_asymptotic_mvn
    outputs: []
    decision_needed: "Does residual persist when NPE training simulator matches the NUTS reference likelihood?"
    notes: "Pilot only; do not make gnk_model the default simulator and do not overwrite empirical-GNK caches."

  - id: gnk-hexadecile-aggregation
    status: pending
    branch: exp-hexadecile-aggregation
    command: null
    inputs:
      cache: res/gnk_hexadeciles/
    outputs: []
    decision_needed: null
    notes: "Use summary-specific oracle and d = d_s + d_theta; expected hexadecile d_s = 15 and d_total = 19."

  - id: ma2-b0-compatibility
    status: pending
    branch: exp-ma2-compatibility
    command: null
    inputs:
      cache: null
    outputs: []
    decision_needed: null
    notes: "Compatibility failure only. Do not include MA2-b0 in pooled BvM-rate fits or Gaussian-NPE family-sufficiency narrative."

  - id: stereological-check
    status: deferred
    branch: null
    command: null
    inputs: {}
    outputs: []
    decision_needed: null
    notes: "Run only if nearly automatic after higher-priority GNK and MA2-b0 tasks."
