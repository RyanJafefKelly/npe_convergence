runs:
  - id: gnk-n500-oracle-gate
    status: completed
    branch: exp-oracle-gate-n500
    command: "python scripts/compute_gnk_n500_oracle_gate.py --n-obs 500 --seeds 0,100 --cache-dir res/gnk --output-dir notebooks/plots --output-prefix gnk_n500_oracle_gate_20260425"
    inputs:
      cache: "res/gnk/nuts_cache_v2_n_obs_500_seed_{0..100}.pkl"
      seeds: 101
      posterior_samples_per_seed: 10000
    outputs:
      - notebooks/plots/gnk_n500_oracle_gate_20260425_per_seed.csv
      - notebooks/plots/gnk_n500_oracle_gate_20260425_summary.json
    decision_needed: null
    notes: "Theta-space Gaussian oracle KL K_theta^*(n=500) median=0.099533 nats, IQR=[0.077337, 0.135198] over 101 cached NUTS posterior seeds. By the <=0.1 nats rule, n=500 is acceptable for the high-budget curve, but it is close to the threshold."

  - id: gnk-coordinate-u-kl-decomp
    status: completed
    branch: exp-u-space-kl-decomp
    reviewed_implementation_commit: 1da4752
    command: "python scripts/compute_gnk_u_space_kl_decomp.py --output-prefix gnk_u_space_kl_decomp_20260425 && python scripts/plot_gnk_u_space_kl_decomp.py --input-csv notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv --output-prefix gnk_u_space_kl_decomp_20260425_N_gt_n --exclude-N-equals-n --min-seeds 101"
    inputs:
      cache:
        nuts: "res/gnk/nuts_cache_v2_n_obs_{n}_seed_{seed}.pkl and res/gnk/nuts_cache_v2_flow_n_obs_{n}_seed_{seed}.pkl"
        gaussian_npe_samples: "res/gnk/gaussian_npe_n_obs_{n}_n_sims_{N}_seed_{seed}/posterior_samples.pkl"
      rows: 1617
      n_values:
        - 100
        - 500
        - 1000
        - 5000
      note: "Raw CSV includes N=n low-budget diagnostic rows and the legacy one-seed N=31623 row. Main Delta component figure excludes N=n and requires at least 101 seeds per (n,N) group."
      jitter_retry: "Pérez-Cruz oracle KL estimates retry with deterministic Gaussian jitter at scale eps * max(pooled_sd, 1.0) only when duplicate/zero nearest-neighbour distances produce non-finite values; applied to 26 unique n=100 seeds for both theta-space and u-space oracle KL, corresponding to 104 repeated rows in the per-config table."
    outputs:
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_summary.json
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_delta_u_mean_cov.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_coord_offset_vs_n.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_plot_metadata.json
      - notebooks/plots/gnk_eta_vs_u_oracle_check_20260425.csv
      - notebooks/plots/gnk_eta_vs_u_oracle_check_20260425.json
    decision_needed: null
    notes: "K_theta^* remains the theta-space BvM-premise diagnostic. coord_offset=K_u^*-K_theta^* is the coordinate-projection offset. Delta_N,u is native u-space Gaussian-NPE approximation error reconstructed from saved Gaussian-NPE posterior samples, not a pure BvM residual. Scientific-code review found no mathematical blocker after excluding the one-seed diagnostic row from the main plot and qualifying finite-sample kNN affine-invariance wording."

  - id: gnk-log-corrected-scaling
    status: completed
    branch: exp-log-corrected-scaling
    command: "python scripts/plot_gnk_u_space_kl_decomp.py --input-csv notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv --output-prefix gnk_u_space_kl_decomp_20260425_N_gt_n --exclude-N-equals-n --min-seeds 101"
    inputs:
      aggregate_table: "notebooks/plots/gnk_u_space_kl_decomp_20260425_per_seed.csv"
      note: "Plot-only task derived from the existing reviewed decomposition CSV; no fresh compute or retraining was run. Main theorem-facing scaled-budget panel excludes N=n and requires at least 101 seeds per (n,N) group. Uses native u-space Gaussian-NPE Delta_u_total from the reviewed decomposition table."
    outputs:
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_delta_u_mean_cov.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_coord_offset_vs_n.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_delta_u_total_scaled_budget_log_corrected.pdf
      - notebooks/plots/gnk_u_space_kl_decomp_20260425_N_gt_n_plot_metadata.json
    decision_needed: null
    notes: "Preserves x = N/(d^2 n) and adds x_log = N/(d^2 n log(N)^2) in a companion two-panel scaled-budget figure with shared y-axis. Natural logs are used. The dotted reference overlay is proportional to log(N)/sqrt(N/(d^2 n)); equivalently proportional to 1/sqrt(x_log) in the log-corrected panel. The log-corrected panel is a finite-N visualisation of the existing BvM logarithmic factor, not a new rate."

